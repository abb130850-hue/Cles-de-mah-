<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les clés de Mah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}

/* Layout: a hand-drawn mind map board (radial on wide screens, two-column tiles on phones) above a detail panel with a 7-day habit tracker. Single light look, on purpose. */
:root{
  --paper:#FFFFFF; --ink:#1E2B33; --muted:#56626B; --line:#DCE1E5; --soft:#F4F6F7;
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--hand);font-weight:700;font-size:clamp(44px,8vw,72px);line-height:1;margin:6px 0 10px;text-wrap:balance}
.lede{max-width:62ch;margin:0;color:var(--ink)}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}

.map{position:relative;height:var(--mapH,700px);margin-top:20px}
svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:240px;height:150px;display:grid;place-items:center;text-align:center}
.center svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.center .who{position:relative;font-family:var(--hand);font-weight:700;font-size:46px;line-height:1}
.center .sub{position:relative;display:block;font-size:13px;line-height:1.25;color:var(--muted);margin:4px auto 0;max-width:170px}
.node{position:absolute;transform:translate(-50%,-50%);width:170px;background:none;border:0;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink);border-radius:16px}
.node .shape{width:96px;height:96px;transition:transform .2s ease}
.node:hover .shape,.node[aria-pressed="true"] .shape{transform:scale(1.08) rotate(-3deg)}
.node:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.node .lbl{font-family:var(--hand);font-weight:700;font-size:27px;line-height:1.02;text-align:center;text-wrap:balance}
.node .tag{font-size:13px;color:var(--muted)}
.node .lbl,.node .tag,.node .count{background:var(--paper);border-radius:8px;padding:0 6px}
.node .count{font-size:12px;font-weight:700;color:var(--muted)}

.panel{margin-top:28px;border:2.5px solid var(--c,#999);border-radius:22px;padding:22px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;background:var(--paper)}
.panel h2{font-family:var(--hand);font-weight:700;font-size:40px;line-height:1;margin:0;display:flex;align-items:center;gap:12px}
.panel h2 svg{width:48px;height:48px;flex:none}
.panel .tagline{color:var(--muted);margin:4px 0 14px}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.panel li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:start}
.panel li::before{content:"";width:10px;height:10px;margin-top:8px;border-radius:3px;background:var(--c);transform:rotate(45deg)}
.habit{background:var(--soft);border-radius:18px;padding:18px;display:grid;gap:12px;align-content:start}
.k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.habit .h{font-family:var(--hand);font-weight:700;font-size:28px;line-height:1.1;margin:0}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{width:44px;height:44px;border-radius:50%;border:2px solid var(--c);background:var(--paper);color:var(--ink);font:700 15px var(--body);cursor:pointer}
.day[aria-pressed="true"]{background:var(--c);color:#fff}
.day:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.why{margin:0;font-size:15px;color:var(--muted)}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.nav button{font:700 15px var(--body);border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer}
.nav button:focus-visible{outline:3px solid var(--c);outline-offset:2px}

.start{margin-top:40px}
.start h2{font-family:var(--hand);font-weight:700;font-size:40px;margin:0 0 12px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.steps li{border:2px dashed var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;min-width:0}
.steps .n{font-family:var(--hand);font-weight:700;font-size:34px;line-height:1;color:var(--muted)}
.steps .t{font-weight:700}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}
footer{margin-top:36px;padding-top:16px;border-top:1.5px solid var(--line);color:var(--muted);font-size:14px}

@media (max-width:780px){
  .map{height:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  svg.links{display:none}
  .center{position:relative;left:auto;top:auto;transform:none;grid-column:1/-1;width:100%;height:120px}
  .node{position:static;transform:none;width:auto;border:2px solid var(--line);padding:12px 8px}
  .node[aria-pressed="true"]{border-color:var(--ink)}
  .node .shape{width:76px;height:76px}
  .node .lbl{font-size:24px}
  .panel{grid-template-columns:minmax(0,1fr);padding:18px}
}
@media (prefers-reduced-motion:reduce){.node .shape{transition:none}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <p class="hint" id="hint"></p>
  </header>

  <section class="map" id="map" aria-label="Carte mentale">
    <svg class="links" id="links" aria-hidden="true"><g id="paths" filter="url(#wob)"></g></svg>
    <div class="center" id="center">
      <svg viewBox="0 0 240 150" preserveAspectRatio="none" aria-hidden="true">
        <g filter="url(#wob)" fill="none" stroke="#1E2B33" stroke-linecap="round">
          <ellipse cx="120" cy="75" rx="114" ry="68" stroke-width="5" fill="#FFFFFF"/>
          <ellipse cx="120" cy="75" rx="104" ry="58" stroke-width="1.6" opacity=".45"/>
        </g>
      </svg>
      <div><span class="who" id="who"></span><span class="sub" id="whosub"></span></div>
    </div>
  </section>

  <section class="panel" id="panel" aria-live="polite"></section>

  <section class="start">
    <h2 id="startTitle"></h2>
    <ol class="steps" id="steps"></ol>
    <p class="note" id="startNote"></p>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/* =====================================================================
   MODIFIER LE CONTENU ICI
   - Change seulement le texte entre guillemets "..." : titres, phrases, habitudes.
   - Garde les guillemets, les virgules et les crochets [ ] à leur place.
   - Pour une apostrophe dans un texte, écris-la normalement : l'apostrophe ' ne pose pas de problème.
   - color : la couleur de la branche (code hexadécimal, ex. #2F6FB2).
   - shape : circle, triangle, square, hexagon, diamond, pentagon, octagon ou star.
   - icon : steth, note, tray, timer, eye, duo, mic, body, blocks, shield, headset, sun, phone, board.
   Enregistre le fichier puis rouvre-le dans le navigateur pour voir le résultat.
   ===================================================================== */
const PAGE = {
  key: "cles-de-mah-v1",
  eyebrow: "Carte des micro-habitudes",
  title: "Les clés de Mah",
  lede: "Tout le monde oublie des choses. Quand les oublis touchent des choses importantes et reviennent souvent, ça vaut la peine d'en parler à un professionnel. En attendant, ces petites habitudes aident vraiment au quotidien.",
  hint: "Touche une forme pour l'ouvrir, puis coche les jours où tu as tenu l'habitude.",
  who: "Mah", whosub: "ma carte des micro-habitudes",
  days: ["L","M","M","J","V","S","D"],
  dayNames: ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"],
  labels: {keep:"À retenir", habit:"Micro-habitude", week:"cette semaine", prev:"Précédent", next:"Suivant"},
  startTitle: "Par où commencer",
  steps: [
    {t:"Le carnet et le rendez-vous", d:"Commencer le carnet des oublis et prendre rendez-vous avec un professionnel."},
    {t:"Le plateau", d:"Installer le plateau près de la porte pour les clés, le téléphone et le portefeuille."},
    {t:"Un Pomodoro par jour", d:"Pendant une semaine, un seul tour de 25 minutes par jour sur la tâche qu'on repousse."}
  ],
  startNote: "Une habitude à la fois : quand elle devient naturelle, on ajoute la suivante.",
  foot: "Ces pistes aident au quotidien mais ne remplacent pas l'avis d'un professionnel de santé.",
  branches: [
    {title:"Faire le point avec un pro", tag:"le diagnostic", color:"#2F6FB2", shape:"circle", icon:"steth",
     points:["Seul un professionnel de santé formé au TDAH de l'adulte (psychiatre, neurologue ou médecin formé) peut poser un diagnostic.",
             "Il s'appuie sur l'histoire des difficultés depuis l'enfance, leur impact au quotidien et des questionnaires standardisés.",
             "Quel que soit le résultat, un avis médical clarifie les choses et ouvre la porte aux bons outils."],
     habit:"Pendant deux semaines, noter chaque oubli important : quoi, quand, et ce que ça a entraîné.",
     why:"Des exemples concrets aident beaucoup le jour de la consultation."},
    {title:"Sortir tout de sa tête", tag:"la mémoire externe", color:"#D2622A", shape:"triangle", icon:"note",
     points:["Ce qui compte est noté tout de suite, pas « plus tard ».",
             "Un seul endroit pour tout : un carnet ou une appli de notes, pas cinq.",
             "Une alarme pour chaque rendez-vous, avec un rappel la veille et une heure avant.",
             "Une photo rapide quand c'est plus simple qu'écrire : un tableau, un papier, une place de parking."],
     habit:"Dès qu'on me confie quelque chose d'important, je le note dans les 10 secondes.",
     why:"La mémoire de travail sature vite : un support extérieur garde l'information à sa place."},
    {title:"Des zones d'atterrissage", tag:"chaque chose à sa place", color:"#2E8B57", shape:"square", icon:"tray",
     points:["Un plateau ou un bol près de la porte : clés, téléphone, portefeuille, badge.",
             "Un tableau ou des post-it bien visibles pour les choses du jour.",
             "Les objets importants ont toujours la même place, à la maison comme au bureau."],
     habit:"En rentrant, je vide mes poches directement dans le plateau.",
     why:"Ce qu'on voit, on s'en souvient : l'environnement fait le rappel à notre place."},
    {title:"Travailler par tours", tag:"la méthode Pomodoro", color:"#7454B0", shape:"hexagon", icon:"timer",
     points:["25 minutes de travail sur une seule tâche, puis 5 minutes de pause.",
             "Après 4 tours, une pause plus longue de 15 à 20 minutes.",
             "Un minuteur bien visible, et le téléphone hors de portée pendant le tour."],
     habit:"Chaque jour, un tour de 25 minutes sur la tâche que je repousse.",
     why:"Un effort court et limité dans le temps est plus facile à commencer et à tenir."},
    {title:"Retenir avec plusieurs sens", tag:"voix, main, couleurs", color:"#C2416E", shape:"diamond", icon:"eye",
     points:["Lire à voix haute ce qui est important : la mémoire auditive.",
             "L'écrire à la main : la mémoire du geste.",
             "Des codes couleurs très marqués : une couleur par type de tâche ou par urgence.",
             "Ce qui stimule se retient mieux : un schéma, un dessin, une image."],
     habit:"Pour chaque information importante, je la dis à voix haute et je l'écris à la main.",
     why:"Plus une information passe par des chemins différents, plus elle laisse de traces."},
    {title:"Le travail en binôme", tag:"le body doubling", color:"#167F86", shape:"pentagon", icon:"duo",
     points:["Avoir quelqu'un dans la même pièce pendant une tâche ennuyeuse ou qui demande de la concentration.",
             "La personne n'a rien à faire : sa présence silencieuse suffit à ancrer l'attention.",
             "Ça marche aussi en appel vidéo, chacun sur sa propre tâche."],
     habit:"Une fois par semaine, un créneau de travail en binôme avec une personne de confiance.",
     why:"La présence d'un autre crée un cadre doux qui aide à rester sur la tâche."}
  ]
};

const SHAPES = {
  circle:'<circle cx="50" cy="50" r="42"/>',
  triangle:'<path d="M50 7 L93 87 L7 87 Z"/>',
  square:'<rect x="11" y="11" width="78" height="78" rx="12"/>',
  hexagon:'<path d="M50 5 L89 27 L89 73 L50 95 L11 73 L11 27 Z"/>',
  diamond:'<path d="M50 4 L95 50 L50 96 L5 50 Z"/>',
  pentagon:'<path d="M50 5 L94 38 L77 91 L23 91 L6 38 Z"/>',
  octagon:'<path d="M33 6 L67 6 L94 33 L94 67 L67 94 L33 94 L6 67 L6 33 Z"/>',
  star:'<path d="M50 5 L61 36 L94 37 L68 57 L77 90 L50 71 L23 90 L32 57 L6 37 L39 36 Z"/>'
};
const ICONS = {
  steth:'M6 3v6a4 4 0 0 0 8 0V3M10 13v2a5 5 0 0 0 10 0v-1M20 13.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4',
  note:'M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M9 8h7M9 12h7M9 16h4',
  tray:'M3 15h18l-2 4H5zM8 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5M10.5 9H16M14 9v2M16 9v1.5',
  timer:'M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16M12 9v4l3 2M9 2h6',
  eye:'M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6',
  duo:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6M2 20c0-3.5 2.7-6 6-6s6 2.5 6 6M17 11a2.5 2.5 0 1 0 0-5M16 14c3 0 6 2 6 5.5',
  mic:'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8',
  body:'M12 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4M12 8v7M6 10l6-2 6 2M9 22l3-7 3 7',
  blocks:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h16v7H4z',
  shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',
  headset:'M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v6H5a1 1 0 0 1-1-1zM20 14h-3v6h2a1 1 0 0 0 1-1zM17 20c0 1-2 2-5 2',
  sun:'M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7',
  phone:'M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2M10 9l5 3-5 3z',
  board:'M3 4h18v11H3zM8 21l4-6 4 6M7 9h6'
};

function tint(hex,a){const n=parseInt(hex.slice(1),16),m=c=>Math.round(255-a*(255-c));return `rgb(${m(n>>16)},${m((n>>8)&255)},${m(n&255)})`}
function shapeSvg(b,size){
  return `<svg class="shape" viewBox="0 0 100 100" aria-hidden="true" ${size?`width="${size}" height="${size}"`:''}>
    <g fill="${tint(b.color,.14)}" stroke="${b.color}" stroke-width="5" stroke-linejoin="round" filter="url(#wob)">${SHAPES[b.shape]}</g>
    <g transform="translate(26 26) scale(2)" fill="none" stroke="${b.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[b.icon]}"/></g>
  </svg>`;
}

let state = {};
try { state = JSON.parse(localStorage.getItem(PAGE.key) || "{}") || {}; } catch(e) { state = {}; }
function save(){ try { localStorage.setItem(PAGE.key, JSON.stringify(state)); } catch(e) {} }
function doneCount(i){ return (state[i]||[]).filter(Boolean).length; }

const $ = id => document.getElementById(id);
$("eyebrow").textContent = PAGE.eyebrow;
$("title").textContent = PAGE.title;
$("lede").textContent = PAGE.lede;
$("hint").textContent = PAGE.hint;
$("who").textContent = PAGE.who;
$("whosub").textContent = PAGE.whosub;
$("startTitle").textContent = PAGE.startTitle;
$("startNote").textContent = PAGE.startNote;
$("foot").textContent = PAGE.foot;
$("steps").innerHTML = PAGE.steps.map((s,i)=>`<li><span class="n">${i+1}</span><span class="t">${s.t}</span><span>${s.d}</span></li>`).join("");

const map = $("map"), n = PAGE.branches.length;
const nodes = PAGE.branches.map((b,i)=>{
  const a = (-90 + i*360/n) * Math.PI/180;
  const el = document.createElement("button");
  el.className = "node"; el.type = "button"; el.id = "node-"+i;
  el.style.left = (50 + 38*Math.cos(a)) + "%";
  el.style.top = (50 + 37*Math.sin(a)) + "%";
  el.innerHTML = shapeSvg(b) + `<span class="lbl">${b.title}</span><span class="tag">${b.tag}</span><span class="count" id="count-${i}"></span>`;
  el.addEventListener("click", ()=>select(i, true));
  map.appendChild(el);
  return el;
});

function drawLinks(){
  const g = $("paths"); g.innerHTML = "";
  if (getComputedStyle($("links")).display === "none") return;
  const r = map.getBoundingClientRect();
  const c = $("center").getBoundingClientRect();
  const cx = c.left + c.width/2 - r.left, cy = c.top + c.height/2 - r.top;
  PAGE.branches.forEach((b,i)=>{
    const s = nodes[i].querySelector(".shape").getBoundingClientRect();
    const x = s.left + s.width/2 - r.left, y = s.top + s.height/2 - r.top;
    const mx = (cx+x)/2 + (y-cy)*0.12, my = (cy+y)/2 - (x-cx)*0.12;
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M${cx} ${cy} Q${mx} ${my} ${x} ${y}`);
    p.setAttribute("fill","none"); p.setAttribute("stroke",b.color);
    p.setAttribute("stroke-width","7"); p.setAttribute("stroke-linecap","round");
    g.appendChild(p);
  });
}

function updateCounts(){
  PAGE.branches.forEach((b,i)=>{ const k = doneCount(i); $("count-"+i).textContent = k ? `${k}/7 ${PAGE.labels.week}` : ""; });
}

let current = 0;
function select(i, scroll){
  current = i;
  const b = PAGE.branches[i], L = PAGE.labels;
  nodes.forEach((el,j)=>el.setAttribute("aria-pressed", j===i ? "true" : "false"));
  const p = $("panel");
  p.style.setProperty("--c", b.color);
  const days = state[i] || [];
  p.innerHTML = `
    <div>
      <h2>${shapeSvg(b,48)}<span>${b.title}</span></h2>
      <p class="tagline">${b.tag}</p>
      <p class="k" style="margin:0 0 8px">${L.keep}</p>
      <ul>${b.points.map(t=>`<li><span>${t}</span></li>`).join("")}</ul>
    </div>
    <div class="habit">
      <p class="k">${L.habit}</p>
      <p class="h">${b.habit}</p>
      <div class="days" role="group" aria-label="${L.habit}">
        ${PAGE.days.map((d,j)=>`<button type="button" class="day" id="day-${i}-${j}" aria-pressed="${days[j]?'true':'false'}" aria-label="${PAGE.dayNames[j]}">${d}</button>`).join("")}
      </div>
      <p class="why" id="weekline"></p>
      <p class="why">${b.why}</p>
      <div class="nav">
        <button type="button" id="prev">${L.prev}</button>
        <button type="button" id="next">${L.next}</button>
      </div>
    </div>`;
  const week = ()=>{ $("weekline").textContent = `${doneCount(i)}/7 ${L.week}`; };
  week();
  PAGE.days.forEach((d,j)=>{
    $(`day-${i}-${j}`).addEventListener("click", e=>{
      state[i] = state[i] || [];
      state[i][j] = !state[i][j];
      e.currentTarget.setAttribute("aria-pressed", state[i][j] ? "true" : "false");
      save(); week(); updateCounts();
    });
  });
  $("prev").addEventListener("click", ()=>select((i-1+n)%n, false));
  $("next").addEventListener("click", ()=>select((i+1)%n, false));
  if (scroll) p.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}

updateCounts();
select(0, false);
drawLinks();
addEventListener("resize", drawLinks);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLinks);
</script>

</body>
</html>
